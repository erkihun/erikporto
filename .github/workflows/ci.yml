name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, pdo_sqlite, gd, zip, exif
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run build
      - name: Byte budgets (initial JS, CSS, first-view fonts)
        run: npm run budgets
      - run: cp .env.example .env && php artisan key:generate
      - run: vendor/bin/pint --test
      - run: php artisan test --log-junit junit.xml
      - name: Keep the test report (the colophon's test count)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit
          path: junit.xml
          retention-days: 30

  # Production runs MySQL 8: JSON columns, the translatable migration and its rollback.
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: portfolio
          MYSQL_ROOT_PASSWORD: password
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -ppassword"
          --health-interval=5s --health-timeout=5s --health-retries=20
    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: portfolio
      DB_USERNAME: root
      DB_PASSWORD: password
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, pdo_mysql, gd, zip, exif
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: composer install --no-interaction --prefer-dist
      - run: npm ci
      - run: npm run build
      - run: cp .env.example .env && php artisan key:generate
      - name: Migrate, roll everything back, migrate again
        run: |
          php artisan migrate --force
          php artisan migrate:rollback --force
          php artisan migrate --force
      - name: Translatable migration round trip with content
        run: |
          php artisan db:seed --class=DemoContentSeeder --force
          php artisan migrate:rollback --path=database/migrations/2026_10_14_000004_make_content_translatable.php --force
          php artisan migrate --force
          php artisan db:seed --class=DemoContentSeeder --force
      - run: php artisan test

  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: intl, pdo_sqlite, gd, zip, opcache
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-dev --optimize-autoloader
      - run: npm ci
      - run: npm run build
      - run: cp .env.example .env && php artisan key:generate
      - name: Lighthouse CI (mobile, budgets in lighthouserc.cjs)
        run: npx lhci autorun
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: .lighthouseci/
          retention-days: 30

  # The numbers the colophon shows: test count and Lighthouse scores of this green run,
  # published as the quality.json asset of the "quality" release (no commits to main).
  # deploy/deploy.sh downloads it into storage/app/quality.json.
  quality:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, mysql, lighthouse]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: junit
          path: ci/junit
      - uses: actions/download-artifact@v4
        with:
          name: lighthouse-reports
          path: ci/lighthouse
      - run: node scripts/quality-report.mjs --junit ci/junit/junit.xml --lighthouse ci/lighthouse/reports --out quality.json
      - name: Publish quality.json
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view quality >/dev/null 2>&1 || gh release create quality --title "Quality report" --notes "Latest CI numbers for the colophon, replaced on every green push to main." --latest=false
          gh release upload quality quality.json --clobber
