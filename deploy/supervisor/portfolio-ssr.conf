; Inertia server-side rendering (bootstrap/ssr/ssr.js, bundled: no node_modules needed).
; Listens on 127.0.0.1:13714 (INERTIA_SSR_URL). If it stops, pages still render client-side.
; deploy/deploy.sh calls `php artisan inertia:stop-ssr`; supervisor starts the new release's bundle.
[program:portfolio-ssr]
command=php /var/www/portfolio/current/artisan inertia:start-ssr
directory=/var/www/portfolio/current
user=www-data
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/var/www/portfolio/shared/storage/logs/ssr.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
