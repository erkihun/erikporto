; Queue worker: contact notifications, Telegram announcements, image processing.
; Copy to /etc/supervisor/conf.d/ and run `supervisorctl reread && supervisorctl update`.
; deploy/deploy.sh calls `php artisan queue:restart` after each release.
[program:portfolio-queue]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/portfolio/current/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
directory=/var/www/portfolio/current
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/var/www/portfolio/shared/storage/logs/queue.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
