# nginx site for the portfolio (copy to /etc/nginx/sites-available/, adjust the names and
# paths marked CHANGE, then `nginx -t && systemctl reload nginx`). Layout from deploy/deploy.sh:
# /var/www/portfolio/current -> the live release.

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com; # CHANGE
    return 301 https://example.com$request_uri; # CHANGE
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name example.com; # CHANGE

    root /var/www/portfolio/current/public;
    index index.php;
    charset utf-8;

    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem; # CHANGE (certbot)
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;   # CHANGE
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # Uploads: images up to 4 MB plus form overhead (Livewire uploads in chunks of this size).
    client_max_body_size 12m;

    # Compression. Laravel already sends the security headers on its responses; static
    # files get the baseline below. Brotli needs the ngx_brotli module (Debian/Ubuntu:
    # libnginx-mod-http-brotli-filter); remove those two lines if it is not installed.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json application/xml text/xml image/svg+xml;
    brotli on;
    brotli_types text/css application/javascript application/json application/xml text/xml image/svg+xml;

    # Vite output: every file name carries a content hash, so it can be cached forever.
    location /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        access_log off;
        try_files $uri =404;
    }

    # Uploaded images (and their WebP variants). Replaced images get new file names.
    location /storage/ {
        add_header Cache-Control "public, max-age=2592000";
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }

    location = /favicon.svg { add_header Cache-Control "public, max-age=604800"; access_log off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.3-fpm.sock; # CHANGE to your PHP-FPM socket
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        include fastcgi_params;
        fastcgi_hide_header X-Powered-By;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
